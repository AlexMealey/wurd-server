; Wurd server: PHP hardening. The server only stores and returns files, so most of PHP stays off.

expose_php = Off
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
error_reporting = E_ALL
; Keep function arguments (which could include the token) out of logged stack traces
zend.exception_ignore_args = On
zend.assertions = -1

; No remote files, no form parsing: the API reads raw request bodies from php://input itself
allow_url_fopen = Off
allow_url_include = Off
file_uploads = Off
enable_post_data_reading = Off

open_basedir = /app:/data
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,phpinfo

; Uploads stream to disk, so requests never need much memory
memory_limit = 64M
max_execution_time = 30
