# Wurd: the frontend as static files at /, and the API through a single PHP front controller at /api.
# PHP runs nowhere else.

Listen 8026
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 60

# A small home server: a few PHP processes are plenty, and keep memory use predictable
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 16
</IfModule>

<IfDefine WURD_BEHIND_PROXY>
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy ${WURD_TRUSTED_PROXIES}
</IfDefine>

<VirtualHost *:8026>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"

    # ---- API ----------------------------------------------------------------

    AliasMatch "^/api(/.*)?$" "/app/public/index.php"
    <Directory /app/public>
        Options None
        AllowOverride None
        Require all granted
        <Files "index.php">
            SetHandler application/x-httpd-php
        </Files>
    </Directory>

    <LocationMatch "^/api(/|$)">
        LimitRequestBody ${WURD_MAX_BODY_BYTES}
        Header always set Cache-Control "no-store"
        Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox"
    </LocationMatch>

    # ---- Frontend (static files, mounted read-only) -------------------------

    DocumentRoot /srv/wurd
    DirectoryIndex index.html
    <Directory /srv/wurd>
        Options None
        AllowOverride None
        Require all granted
        php_admin_flag engine off
        Header always set Cache-Control "no-cache"
        # wasm-unsafe-eval: hash-wasm's Argon2id (encrypted LibreOffice files).
        # Inline styles: documents carry style attributes.
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    </Directory>

    # Never serve .git, .env and other dotfiles from the frontend folder
    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
